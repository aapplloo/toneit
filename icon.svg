<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ea6ff"/>
      <stop offset="1" stop-color="#1a5fd8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0b2f73" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- guitar pick -->
  <path filter="url(#sh)" fill="#ffffff" d="M512 196 C 712 196 824 262 824 386 C 824 566 640 766 556 834 C 530 855 494 855 468 834 C 384 766 200 566 200 386 C 200 262 312 196 512 196 Z"/>
  <!-- sound wave -->
  <path d="M318 430 C 352 430 360 340 394 340 C 428 340 436 520 470 520 C 504 520 512 300 546 300 C 580 300 588 560 622 560 C 656 560 664 430 706 430"
        fill="none" stroke="#3182f6" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- play dot -->
  <circle cx="512" cy="676" r="34" fill="#00c471"/>
</svg>
